# Copy to secret.yaml, fill in real values, and NEVER commit secret.yaml to git.
#
# CRITICAL: JWT_SECRET must be byte-for-byte IDENTICAL across every one of the
# 6 backend services' secret.yaml files. auth-service issues the token; every
# other service independently verifies its signature using this same value -
# if even one service's JWT_SECRET differs, that service will silently reject
# every token as invalid, and it will look like a random, unrelated 401/403.
apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secret
  namespace: eventix
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: eventix
  SPRING_DATASOURCE_PASSWORD: change-me
  JWT_SECRET: change-me-to-a-long-random-string-and-use-the-SAME-value-everywhere
