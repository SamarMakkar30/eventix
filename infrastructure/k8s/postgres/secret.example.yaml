# Copy to secret.yaml, fill in a real password, and NEVER commit secret.yaml.
# This username/password pair must match what every service's own secret.yaml
# uses for SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: eventix
type: Opaque
stringData:
  POSTGRES_USER: eventix
  POSTGRES_PASSWORD: change-me
