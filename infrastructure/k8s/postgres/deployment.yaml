apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: eventix
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two pods must never mount the same
  # ReadWriteOnce volume at once, which a rolling update could briefly attempt.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: POSTGRES_MULTIPLE_DATABASES
              value: "auth_db,catalog_db,inventory_db,booking_db,payment_db,notification_db"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
            defaultMode: 0755
