server:
  port: 8082

spring:
  application:
    name: catalog-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${SPRING_DATASOURCE_USERNAME:eventix}
    password: ${SPRING_DATASOURCE_PASSWORD:eventix}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

aws:
  s3:
    bucket-name: ${S3_BUCKET_NAME:eventix-assets}
    region: ${AWS_REGION:ap-south-1}

jwt:
  # Must match auth-service's JWT_SECRET exactly - it validates tokens it did not issue.
  secret: ${JWT_SECRET:dev-only-secret-please-change-me-before-any-real-deployment-32chars-min}

inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://inventory-service:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: catalog-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
