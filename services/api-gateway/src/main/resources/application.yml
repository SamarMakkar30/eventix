server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Without this, every request the React frontend makes gets blocked by the
      # browser before it even reaches here - CORS is enforced client-side, and a
      # REST client like curl or Postman would never reveal that the API "works"
      # but the frontend "doesn't". Easy to lose an afternoon to if skipped.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: catalog-service
          uri: http://catalog-service:8082
          predicates:
            - Path=/api/catalog/**
          filters:
            - StripPrefix=1
        - id: inventory-service
          uri: http://inventory-service:8083
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=1
        - id: booking-service
          uri: http://booking-service:8084
          predicates:
            - Path=/api/bookings/**
          filters:
            - StripPrefix=1
        - id: payment-service
          uri: http://payment-service:8085
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1
        - id: notification-service
          uri: http://notification-service:8086
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway