server:
  port: 8083

spring:
  application:
    name: inventory-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${SPRING_DATASOURCE_USERNAME:eventix}
    password: ${SPRING_DATASOURCE_PASSWORD:eventix}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  # Must match auth-service's JWT_SECRET exactly - it validates tokens it did not issue.
  secret: ${JWT_SECRET:dev-only-secret-please-change-me-before-any-real-deployment-32chars-min}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: inventory-service
