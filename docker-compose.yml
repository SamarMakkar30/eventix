services:
  postgres:
    image: postgres:16-alpine
    container_name: eventix-postgres
    environment:
      POSTGRES_USER: eventix
      POSTGRES_PASSWORD: eventix
      POSTGRES_MULTIPLE_DATABASES: auth_db,catalog_db,inventory_db,booking_db,payment_db,notification_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventix -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eventix-net

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: eventix
      SPRING_DATASOURCE_PASSWORD: eventix
      JWT_SECRET: local-dev-secret-do-not-use-this-value-anywhere-real-32chars
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eventix-net
  catalog-service:
    build: ./services/catalog-service
    container_name: catalog-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog_db
      SPRING_DATASOURCE_USERNAME: eventix
      SPRING_DATASOURCE_PASSWORD: eventix
    ports:
      - "8082:8082"
    depends_on:
      - postgres
    networks:
      - eventix-net
  inventory-service:
    build: ./services/inventory-service
    container_name: inventory-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: eventix
      SPRING_DATASOURCE_PASSWORD: eventix
    ports:
      - "8083:8083"
    depends_on:
      - postgres
    networks:
      - eventix-net
  booking-service:
    build: ./services/booking-service
    container_name: booking-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_db
      SPRING_DATASOURCE_USERNAME: eventix
      SPRING_DATASOURCE_PASSWORD: eventix
    ports:
      - "8084:8084"
    depends_on:
      - postgres
    networks:
      - eventix-net
  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: eventix
      SPRING_DATASOURCE_PASSWORD: eventix
    ports:
      - "8085:8085"
    depends_on:
      - postgres
    networks:
      - eventix-net
  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: eventix
      SPRING_DATASOURCE_PASSWORD: eventix
    ports:
      - "8086:8086"
    depends_on:
      - postgres
    networks:
      - eventix-net

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - catalog-service
      - inventory-service
      - booking-service
      - payment-service
      - notification-service
    networks:
      - eventix-net

  frontend:
    build: ./frontend
    container_name: eventix-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - eventix-net

volumes:
  pgdata:

networks:
  eventix-net:
    driver: bridge
